# The site is static and lives in /public. Each deploy refreshes the channel list from iptv-org
# (falls back to the copy in playlists/ if iptv-org can't be reached).
# To rebuild locally after editing playlists/: node scripts/build-channels.mjs [--fetch]
[build]
  publish = "public"
  command = "node scripts/build-channels.mjs --fetch"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

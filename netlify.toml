# The site is static and lives in /public. Each deploy refreshes the channel list from iptv-org
# (falls back to the copy in playlists/ if iptv-org can't be reached).
# To rebuild locally after editing playlists/: node scripts/build-channels.mjs [--fetch]
[build]
  publish = "public"
  command = "node scripts/build-channels.mjs --fetch && node scripts/build-legacy-js.mjs && node scripts/build-legacy-css.mjs --write && node scripts/version-assets.mjs --write"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Scripts and styles: browsers reuse their copy for 5 minutes, and after that show it straight away while checking for
# a newer one in the background. index.html points at fingerprinted addresses (scripts/version-assets.mjs), so a deploy
# is picked up at once. Before this, every launch asked the server about ~30 files one after another.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=604800"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# The Android app (android/, built by .github/workflows/android.yml): /apk always gives the newest APK
[[redirects]]
  from = "/apk"
  to = "https://github.com/jonnybenson1986-cmyk/movies-2026/releases/latest/download/StreamBox.apk"
  status = 302
  force = true

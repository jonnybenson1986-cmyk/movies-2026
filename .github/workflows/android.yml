# Builds the StreamBox Android app (android/) and publishes it as a GitHub release, so
#   https://github.com/<owner>/<repo>/releases/latest/download/StreamBox.apk   (and the site's /apk)
# always gives the newest APK. Runs when android/ changes, or by hand (Actions -> Android app -> Run workflow).
# The app opens the website, so website changes reach it without a new APK.
#
# Signing (optional but recommended): with the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD every build is signed with the same key, so a new APK installs over the
# old one. Without them each build is signed with a throw-away key (see README: "Android app (APK)").
name: Android app

on:
  push:
    branches: [claude/wonderful-keller-94obao]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Website the app opens'
        required: false
        default: 'https://movies2026564.netlify.app/'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=your release key" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with a throw-away key: to update, uninstall the old app first. See README."
            echo "SIGNED_WITH=a temporary key (uninstall an older StreamBox app before installing this one)" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SITE_URL: ${{ inputs.site_url || 'https://movies2026564.netlify.app/' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }} -PsiteUrl="$SITE_URL"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/StreamBox.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StreamBox-apk
          path: StreamBox.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-1.${{ github.run_number }}" StreamBox.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "StreamBox for Android 1.${{ github.run_number }}" \
            --notes "StreamBox for Android phones, tablets and Android TV. Download **StreamBox.apk** below, open it and choose Install (allow your browser or file manager to install apps if Android asks). On Android TV use the Downloader app with the site's /apk address. Signed with ${SIGNED_WITH}."

services:
  - type: web
    name: streambox-opentune
    runtime: python
    plan: free
    rootDir: opentune-service
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        sync: false

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>StreamBox · Spotify</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #000; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; }
    p { color: #a1a1a6; max-width: 360px; line-height: 1.5; }
    a { display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 999px; background: #f5f5f7; color: #000; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main><h1 id="title">Connecting Spotify…</h1><p id="note"></p><a href="/#music" id="back" hidden>Back to Music</a></main>
  <script src="/js/account.js"></script>
  <script src="/js/spotify.js"></script>
  <script>
    // Spotify sends people back here after they agree to connect it. The app keeps the StreamBox sign-in for this tab
    // (sessionStorage), so the page goes back into the app afterwards.
    (async () => {
      try { await window.StreamBoxAccount?.ready; } catch (e) { /* no account system: fine */ }
      try {
        const back = await window.StreamBoxSpotify.finish();
        try { sessionStorage.setItem('sb_unlocked', '1'); } catch (e) { /* private mode */ }
        location.replace('/' + (String(back).startsWith('#') ? back : '#music'));
      } catch (e) {
        document.getElementById('title').textContent = 'Spotify isn’t connected';
        document.getElementById('note').textContent = e.message;
        document.getElementById('back').hidden = false;
      }
    })();
  </script>
</body>
</html>

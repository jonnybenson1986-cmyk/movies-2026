<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>StreamBox · Spotify</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #000; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; }
    p { color: #a1a1a6; max-width: 360px; line-height: 1.5; }
    a { display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 999px; background: #f5f5f7; color: #000; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main><h1 id="title">Connecting Spotify…</h1><p id="note"></p><a href="/#music" id="back" hidden>Back to Music</a></main>
  <script>
    // Same as index.html: older TV browsers get the converted scripts in js/legacy/ (written in ES5 so it runs anywhere).
    (function () {
      var dir = '/js/';
      try { new Function('var a = null; return a?.b ?? 1')(); } catch (e) { dir = '/js/legacy/'; }
      document.write('<script src="/js/tv.js"><\/script><script src="' + dir + 'account.js"><\/script><script src="' + dir + 'spotify.js"><\/script>');
    })();
  </script>
  <script>
    // Spotify sends people back here after they agree to connect it. The app keeps the StreamBox sign-in for this tab
    // (sessionStorage), so the page goes back into the app afterwards.
    (function () {
      var account = window.StreamBoxAccount, ready = account && account.ready;
      Promise.resolve(ready).catch(function () { /* no account system: fine */ }).then(function () {
        return window.StreamBoxSpotify.finish();
      }).then(function (back) {
        try { sessionStorage.setItem('sb_unlocked', '1'); } catch (e) { /* private mode */ }
        back = String(back);
        location.replace('/' + (back.charAt(0) === '#' ? back : '#music'));
      }).catch(function (e) {
        document.getElementById('title').textContent = 'Spotify isn\u2019t connected';
        document.getElementById('note').textContent = e && e.message ? e.message : String(e);
        document.getElementById('back').hidden = false;
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // Which version of the app's JavaScript this browser can read (older TV browsers, e.g. Android TV WebViews):
    // - modern (Chromium 80+, 2020 on): js/*.js as written
    // - "legacy-js" (ES2015 engines, Chromium 51-79): js/legacy/*.js, the same scripts converted at build time
    //   (scripts/build-legacy-js.mjs), with missing browser features filled in by js/tv.js
    // - "too-old" (older still): js/tv.js shows how to update instead of leaving a blank screen
    (function () {
      var html = document.documentElement;
      try { new Function('var a = null; return a?.b ?? 1')(); return; } catch (e) { /* not modern */ }
      try {
        new Function('let { a } = { a: 1 }; class C {} const f = (x = 1, ...r) => x; return f(...[a]) + `${a}`')();
        if (!window.Promise || !window.fetch || !window.Symbol) throw new Error('missing basics');
        html.className += ' legacy-js';
      } catch (e) { html.className += ' too-old'; }
    })();
  </script>
  <script>
    // Passcode on every launch: when a passcode gate is in front of the app (it sets the sb_gate_on cookie),
    // this tab must have been unlocked in this session. sessionStorage is cleared when the tab or app closes.
    (function () {
      try {
        if (!/(?:^|;\s*)sb_gate_on=1/.test(document.cookie) || sessionStorage.getItem('sb_unlocked') === '1') return;
        document.documentElement.style.display = 'none';
        location.replace('/__gate/lock?next=' + encodeURIComponent(location.pathname + location.search));
      } catch (e) { /* storage blocked: the session cookie still applies */ }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>StreamBox</title>
  <meta name="description" content="Live TV, sports and movies in one Netflix-style player.">
  <meta name="streambox-app" content="streambox">
  <meta name="theme-color" content="#141414">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://cdn.jsdelivr.net"><!-- hls.js (the live-channel player) loads from here after launch -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StreamBox">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The font loads without holding up the first screen (media="print" until loaded): until then the system font shows -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/personal-library.css">
  <link rel="stylesheet" href="/css/apple.css">
  <link rel="stylesheet" href="/css/remote.css">
  <link rel="stylesheet" href="/css/guide.css">
  <link rel="stylesheet" href="/css/music.css">
  <link rel="stylesheet" href="/css/classics.css">
  <link rel="stylesheet" href="/css/watch.css">
  <link rel="stylesheet" href="/css/touch.css">
  <link rel="stylesheet" href="/css/tv.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn back-btn" id="backBtn" type="button" aria-label="Back" title="Back" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg>
    </button>
    <a class="logo" href="#home">STREAMBOX</a>
    <nav class="nav" id="nav">
      <a href="#home" data-route="home">Home</a>
      <a href="#countries" data-route="live">Live TV</a>
      <a href="#movies" data-route="movies">Movies</a>
      <a href="#movy" data-route="movy">Movy</a>
      <a href="#sports" data-route="sports">Sports</a>
      <a href="#music" data-route="music">Music</a>
      <a href="#mylist" data-route="mylist">My List</a>
      <a href="#library" data-route="library">My Library</a>
    </nav>
    <div class="topbar-actions">
      <button class="btn btn-red install-btn" id="installBtn" type="button" hidden aria-label="Download the StreamBox app">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>Get the app</span>
      </button>
      <button class="icon-btn" id="searchToggle" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="appFsBtn" type="button" aria-label="Full screen" title="Full screen (F)" hidden></button>
      <input class="search-input" id="searchInput" type="search" placeholder="Search channels & movies…" autocomplete="off">
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <a href="#home" data-route="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#countries" data-route="live"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m8 2 4 4 4-4"/></svg>Live TV</a>
    <a href="#movies" data-route="movies"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 12h20"/></svg>Movies</a>
    <a href="#movy" data-route="movy" data-more><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM9 8l7 4-7 4z"/></svg>Movy</a>
    <a href="#sports" data-route="sports" data-more><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>Sports</a>
    <a href="#music" data-route="music"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Music</a>
    <a href="#mylist" data-route="mylist" data-more><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>My List</a>
    <a href="#library" data-route="library" data-more><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m10 8 5 4-5 4z"/></svg>Library</a>
    <button type="button" class="tab-more" id="tabMore" aria-haspopup="dialog" aria-expanded="false" aria-controls="moreSheet"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
  </nav>
  <!-- Phones: the tabs that don't fit in the tab bar, plus shortcuts -->
  <div class="more-sheet" id="moreSheet" role="dialog" aria-modal="true" aria-label="More" hidden>
    <div class="more-card">
      <div class="more-grab" aria-hidden="true"></div>
      <nav class="more-grid" aria-label="More sections">
        <a href="#sports" data-route="sports"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>Sports</a>
        <a href="#guide" data-route="guide"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>TV Guide</a>
        <a href="#classics" data-route="classics"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16"/></svg>Free Classics</a>
        <a href="#movy" data-route="movy"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM9 8l7 4-7 4z"/></svg>Movy</a>
        <a href="#mylist" data-route="mylist"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>My List</a>
        <a href="#library" data-route="library"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="m10 8 5 4-5 4z"/></svg>My Library</a>
        <button type="button" data-more-act="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
        <button type="button" data-more-act="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</button>
      </nav>
      <button type="button" class="btn btn-more more-close" data-more-act="close">Close</button>
    </div>
  </div>
  <div class="player" id="player" hidden>
    <iframe id="movieFrame" title="Movie player" hidden allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>
    <div id="movieTools" class="movie-tools" hidden>
      <label for="movieSource">Source</label><select id="movieSource"></select>
      <a id="movieExternal" class="btn btn-more" target="_blank" rel="noopener noreferrer">Open source ↗</a>
      <button id="movieNextSource" class="btn btn-more" type="button">Try next source</button>
      <span id="movieSourceStatus" role="status" aria-live="polite"></span>
    </div>
    <video id="video" playsinline controls x-webkit-airplay="allow"></video>
    <div class="player-top">
      <button class="icon-btn" id="playerClose" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg>
      </button>
      <div class="player-title">
        <span class="live-pill" id="playerLive">LIVE</span>
        <strong id="playerTitle"></strong>
        <small id="playerSub"></small>
      </div>
      <div class="player-nav">
        <button class="icon-btn" id="playerAirTop" type="button" aria-label="AirPlay" title="AirPlay" hidden></button>
        <button class="icon-btn" id="playerFsTop" type="button" aria-label="Full screen" title="Full screen (F)"></button>
        <button class="icon-btn" id="playerPrev" aria-label="Previous channel"><svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button>
        <button class="icon-btn" id="playerNext" aria-label="Next channel"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
    </div>
    <!-- Controls for live channels (hidden for movies and library videos) -->
    <div class="player-bar" id="playerBar">
      <button class="icon-btn" id="playerPlay" type="button" aria-label="Pause"></button>
      <button class="icon-btn" id="playerMute" type="button" aria-label="Mute"></button>
      <input class="player-vol" id="playerVol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <span class="player-live"><span class="dot"></span>LIVE</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="playerSubs" type="button" aria-label="Subtitles" aria-haspopup="menu" aria-expanded="false" title="Subtitles (C)"></button>
      <button class="icon-btn" id="playerAirplay" type="button" aria-label="AirPlay" title="AirPlay" hidden></button>
      <button class="icon-btn" id="playerPip" type="button" aria-label="Picture in picture" hidden></button>
      <button class="icon-btn" id="playerFs" type="button" aria-label="Full screen"></button>
    </div>
    <!-- Channel remote: channel up/down, country left/right, and the channel list (live channels only) -->
    <div class="zap-banner" id="zapBanner" hidden role="status" aria-live="polite"></div>
    <div class="zap-remote" id="zapRemote" role="group" aria-label="Channel remote">
      <button class="zap-key up" id="zapChUp" type="button" aria-label="Channel up" title="Channel up (↑)"><svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg><small>CH</small></button>
      <button class="zap-key left" id="zapCtryPrev" type="button" aria-label="Previous country" title="Previous country (←)"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
      <button class="zap-key ok" id="zapOk" type="button" aria-label="Channel list" title="Channel list (Enter)"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <button class="zap-key right" id="zapCtryNext" type="button" aria-label="Next country" title="Next country (→)"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="zap-key down" id="zapChDown" type="button" aria-label="Channel down" title="Channel down (↓)"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><small>CH</small></button>
      <span class="zap-cap" aria-hidden="true">Country</span>
    </div>
    <aside class="zap-panel" id="zapPanel" hidden aria-label="Channels">
      <div class="zap-head"><strong>Channels</strong><button class="icon-btn" id="zapClose" type="button" aria-label="Close channel list"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
      <div class="zap-countries" id="zapCountries" role="tablist" aria-label="Countries"></div>
      <div class="zap-list" id="zapList" role="listbox" aria-label="Channels in this country"></div>
    </aside>
    <div class="subs-menu" id="subsMenu" role="menu" aria-label="Subtitles" hidden></div>
    <div class="player-hint" id="playerHint" hidden></div>
    <div class="player-msg" id="playerMsg" hidden></div>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modalCard"></div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="/js/tv.js"></script><!-- first, and plain ES5: remote control, media keys, TV mode, old-engine notice -->
  <script>
    // The app's scripts, in this order. Modern browsers get js/, older TV browsers the converted copies in js/legacy/
    // (see the first script in <head>). document.write keeps them exactly like plain <script> tags: each runs in
    // order, before the page finishes loading. scripts/build-legacy-js.mjs's test checks this list against js/.
    (function () {
      var c = ' ' + document.documentElement.className + ' ';
      if (c.indexOf(' too-old ') >= 0) return;
      var dir = c.indexOf(' legacy-js ') >= 0 ? '/js/legacy/' : '/js/', tags = '';
      var V = {};   // filled in at deploy by scripts/version-assets.mjs: a fingerprint per script, so browsers can keep them
      var files = ['zapper', 'subtitles', 'tv-guide', 'classics', 'spotify', 'music', 'music-ui', 'account', 'passkey', 'artwork', 'movie-catalog', 'movies-ui', 'australia-ui', 'movy-browser', 'movy-setup', 'watch-providers', 'movy-ui', 'movie-playback', 'personal-library', 'app', 'touch'];
      for (var i = 0; i < files.length; i++) tags += '<script src="' + dir + files[i] + '.js' + (V[files[i]] ? '?v=' + V[files[i]] : '') + '"><\/script>';
      document.write(tags);
    })();
  </script>
</body>
</html>
